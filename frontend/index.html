<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NeonFoodmap - Bản đồ ẩm thực Sài Gòn</title>

    <!-- Preconnect Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Preload critical fonts -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" />
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <style>
      /* Ẩn root cho đến khi font sẵn sàng */
      #root { opacity: 0; transition: opacity 0.3s ease; }
      #root.fonts-ready { opacity: 1; }
    </style>
  </head>
  <body>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Chờ tất cả font (kể cả Material Symbols) load xong rồi mới reveal app
      document.fonts.ready.then(function() {
        var root = document.getElementById('root');
        if (root) root.classList.add('fonts-ready');
      });
    </script>
  </body>
</html>
